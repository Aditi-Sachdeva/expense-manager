<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts — Expense Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Menu button for mobile -->
  <button id="menuBtn" style="background:none; border:none; font-size:24px; cursor:pointer;">
    <svg width="22" height="22" viewBox="0 0 24 24">
      <path d="M3 6h18M3 12h18M3 18h18" stroke="#6a0dad" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <!-- Main content -->
  <main class="main-content">

    <!-- Page title -->
    <div class="page-header">
      <h1>Accounts</h1>
      <p>Manage your bank accounts, cash, and wallets.</p>
    </div>

    <!-- Everything below the header -->
    <div class="page-content">

      <!-- Heading on the left, button on the right -->
      <div class="page-top">
        <div>
          <h2>All Accounts</h2>
          <p>Track balances across your financial sources</p>
        </div>

        <div>
          <button class="btn btn-primary" id="addAccountBtn">+ Add Account</button>
        </div>
      </div>

      <!-- Accounts table -->
      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Account Name</th>
                <th>Type</th>
                <th>Initial Balance (₹)</th>
                <th>Current Balance (₹)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <!-- JS will add one row here for every account -->
            <tbody id="accountsTableBody"></tbody>
          </table>
        </div>

        <!-- Shown when there are no accounts -->
        <div class="empty" id="emptyMessage">
          <h4>No accounts added yet</h4>
          <p>Add your first bank account, cash wallet, or card to get started.</p>
        </div>

        <div class="table-footer">
          Showing <span id="accountCount">0</span> accounts
        </div>
      </section>

    </div>

  </main>

  <script src="js/sidebar.js"></script>
</body>

</html>
